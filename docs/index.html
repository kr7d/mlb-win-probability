<!DOCTYPE html>
<html>
<head>
  <title>Win Expectancy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>MLB Win Expectancy Calculator</h1>

  <div class="quantity">
    <label>Inning</label>
    <button type="button" class="qty-btn" id="inn_minus_btn">-</button>
    <label class="score-label" id="inn_label">1</label>
    <button type="button" class="qty-btn" id="inn_plus_btn">+</button>
  </div>

  <div class="quantity">
    <label>Home score</label>
    <button type="button" class="qty-btn" id="score_h_minus_btn">-</button>
    <label class="score-label" id="score_h_label">0</label>
    <button type="button" class="qty-btn" id="score_h_plus_btn">+</button>
  </div>

  <div class="quantity">
    <label>Away score</label>
        <button type="button" class="qty-btn" id="score_v_minus_btn">-</button>
        <label class="score-label" id="score_v_label">0</label>
        <button type="button" class="qty-btn" id="score_v_plus_btn">+</button>
  </div>

  <div class="quantity">
    <label>Outs</label>
        <button type="button" class="qty-btn" id="outs_minus_btn">-</button>
        <label class="score-label" id="outs_label">0</label>
        <button type="button" class="qty-btn" id="outs_plus_btn">+</button>
  </div>

  <form>
    <input type="radio" id="top" name="half" value="T" checked>
    <label for="top">Top</label>

    <input type="radio" id="bottom" name="half" value="B">
    <label for="bottom">Bottom</label>

    <div></div>

    <input type="checkbox" id="r1" name="runners" value="1">
    <label for=""r1>Runner on 1st Base</label>
    <div></div>
    <input type="checkbox" id="r2" name="runners" value="2">
    <label for=""r2>Runner on 2nd Base</label>
    <div></div>
    <input type="checkbox" id="r3" name="runners" value="3">
    <label for=""r3>Runner on 3rd Base</label>
  </form>

  <script src="js/main.js" type="module"></script>
</body>
</html>
