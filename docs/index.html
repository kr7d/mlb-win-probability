<!DOCTYPE html>
<html>
<head>
  <title>Win Expectancy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h1>MLB Win Expectancy Calculator</h1>

  <div class="score">
    <label>Home score:</label>
    <button type="button" class="qty-btn" id="score_h_minus_btn">-</button>
    <input type="number" class="input" id="score_h_input" min="0" max="99" value="0" readonly>
    <button type="button" class="qty-btn" id="score_h_plus_btn">+</button>
    <script src="js/main.js" type="module"></script>
  </div>
</body>
</html>
