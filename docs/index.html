<!DOCTYPE html>
<html>
<head>
  <title>Win Expectancy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="title-section">
    <img src="../images/icon.jpg" alt="1 baseball with 2 bats" width="80">
    <h1>MLB Win Expectancy Calculator</h1>
  </div>
  <p></p>
  <div class="quantity">
    <label>Inning</label>
    <button type="button" class="qty-btn" id="inn_minus_btn">-</button>
    <label class="qty-label" id="inn_label">1</label>
    <button type="button" class="qty-btn" id="inn_plus_btn">+</button>
  </div>

  <div class="quantity">
    <label>Home lead</label>
    <button type="button" class="qty-btn" id="diff_minus_btn">-</button>
    <label class="qty-label" id="diff_label">0</label>
    <button type="button" class="qty-btn" id="diff_plus_btn">+</button>
  </div>

  <div class="quantity">
    <label>Outs</label>
        <button type="button" class="qty-btn" id="outs_minus_btn">-</button>
        <label class="qty-label" id="outs_label">0</label>
        <button type="button" class="qty-btn" id="outs_plus_btn">+</button>
  </div>

  <form>
    <input type="radio" id="top" name="half" value="T" checked>
    <label for="top">Top</label>

    <input type="radio" id="bottom" name="half" value="B">
    <label for="bottom">Bottom</label>

    <div></div>

    <input type="checkbox" id="r1" name="runners" value="1">
    <label for=""r1>Runner on 1st Base</label>
    <div></div>
    <input type="checkbox" id="r2" name="runners" value="2">
    <label for=""r2>Runner on 2nd Base</label>
    <div></div>
    <input type="checkbox" id="r3" name="runners" value="3">
    <label for=""r3>Runner on 3rd Base</label>


  </form>

  <p></p>

  <label id="home-win-prob">Home win probability: 0.00%</label>
  <div></div>
  <label id="home-wins">Home wins: 0</label>
  <div></div>
  <label id="occurrences">Occurrences: 0</label>

  <script src="js/main.js" type="module"></script>
</body>
</html>
